apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: player-data-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hyrasch/opusmajor.git
    targetRevision: HEAD
    path: k8s/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
