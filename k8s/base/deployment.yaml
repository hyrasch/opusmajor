apiVersion: apps/v1
kind: Deployment
metadata:
  name: player-data-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: player-data-api
  template:
    metadata:
      labels:
        app: player-data-api
    spec:
      containers:
        - name: player-data-api
          image: docker.io/lanrell/player-data-api:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
